general.live_config_reload = true

[terminal]
shell = "/bin/zsh"

[window]
decorations = "Buttonless"
blur = true
startup_mode = "Maximized"
title = "BATMAN"

[font]
normal = {family = "JetBrainsMono Nerd Font", style = "Regular"}
size = 20

[cursor]
style = { shape = "Block", blinking = "On"}

[mouse]
hide_when_typing = true
