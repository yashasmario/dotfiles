set -a terminal-features "tmux-256color"
set -g focus-events on
set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on   
set -g mode-keys vi

set -g default-terminal "tmux-256color"

set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=#66b2b2 ,bold"

set -g status-right "%H:%M"

bind r source-file "~/.config/tmux/tmux.conf"
bind b set -g status
bind g run-shell "~/.config/scripts/open-github.sh"
bind w run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/code"
bind D run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/.config"
bind N run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/Documents/obsidian-me"
bind f run "tmux neww ~/.config/scripts/tmux-session-dispensary.sh"
bind E show-environment -g
